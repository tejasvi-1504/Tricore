<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Teaching plan — Kanishka Creates</title>
<link rel="icon" type="image/png" sizes="96x96" href="assets/logo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<script>
/* Adopt the saved admin theme before paint. The value is cached from the
   server by the admin panel; this page only reads it. */
try { const t = localStorage.getItem('kc-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root{
  --white:#fff; --soft:#fdf9fb; --ink:#1a1020; --body:#4a3f46; --muted:#7d6970;
  --line:#f2e9ec; --brand:#bd517b; --brand-600:#95375b; --brand-100:#f8e7ee;
  --violet:#8b60c7; --violet-100:#f0e9fe;
  --green:#16a34a; --green-100:#e7f7ed; --green-700:#12703a;
  --amber:#a86a00; --amber-100:#fef4e3;
  --red:#dc2626; --red-100:#fdeaea;
  --r-sm:10px; --r:16px;
  --sh-sm:0 2px 10px rgba(60,20,40,.05);
  --sh-md:0 10px 30px rgba(60,20,40,.09);
  --f-h:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-script:'Great Vibes','Segoe Script',cursive;
}
/* ── themes ───────────────────────────────────────────────────────────────
   Eight palettes, all generated so white-on-brand clears WCAG AA (4.55+).
   Switching only swaps these variables; nothing else in the sheet knows
   which theme is on. The choice is kept in localStorage per browser.        */
:root{
  --white:#fff;
  --accent:#f5a524; --accent-100:#fef4e3; --accent-700:#a86a00;
  --green:#16a34a; --green-100:#e7f7ed; --green-700:#12703a;
  --red:#dc2626; --red-100:#fdeaea;
  --r-sm:10px; --r:16px; --r-lg:22px;
  --sh-xs:0 1px 2px rgba(20,20,30,.05);
  --sh-sm:0 2px 8px rgba(20,20,30,.06);
  --sh-md:0 10px 28px rgba(20,20,30,.09);
  --sh-lg:0 20px 50px rgba(20,20,30,.13);
  --e:cubic-bezier(.22,.9,.3,1);
  --e-out:cubic-bezier(.16,1,.3,1);
  --f-h:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-script:'Great Vibes','Segoe Script',cursive;

  /* slate is the default — neutral, and the easiest to read all day */
  --ink:#151a21; --body:#454f5c; --muted:#6b7684;
  --brand:#5a77a0; --brand-600:#3e5779; --brand-100:#eaeff6;
  --soft:#fbfbfc; --tint:#f3f4f7; --line:#eaecee;
}
[data-theme="lavender"]{
  --ink:#191524; --body:#4c4560; --muted:#736c88;
  --brand:#8763bf; --brand-600:#643da4; --brand-100:#eee7f8;
  --soft:#fbfbfc; --tint:#f4f1f8; --line:#ebe8f0;
}
[data-theme="emerald"]{
  --ink:#0f1f1a; --body:#3d5149; --muted:#63786f;
  --brand:#2a8469; --brand-600:#185442; --brand-100:#e6f9f4;
  --soft:#fafdfc; --tint:#f0f9f7; --line:#e6f2ee;
}
[data-theme="pistachio"]{
  --ink:#1a2013; --body:#4a5440; --muted:#6f7a64;
  --brand:#567f39; --brand-600:#375322; --brand-100:#eef7e8;
  --soft:#fbfcfb; --tint:#f4f8f2; --line:#ebefe9;
}
[data-theme="teal"]{
  --ink:#0e1c1f; --body:#3c4f53; --muted:#63767a;
  --brand:#287d8a; --brand-600:#175059; --brand-100:#e5f7fa;
  --soft:#fafcfd; --tint:#f0f8fa; --line:#e6f1f2;
}
[data-theme="indigo"]{
  --ink:#16161f; --body:#464660; --muted:#6d6d85;
  --brand:#6d69bf; --brand-600:#4540a5; --brand-100:#e9e8f8;
  --soft:#fbfbfc; --tint:#f2f2f8; --line:#e9e8ef;
}
[data-theme="amber"]{
  --ink:#201a12; --body:#54483a; --muted:#7a6d5e;
  --brand:#9f6728; --brand-600:#6d4518; --brand-100:#faf0e5;
  --soft:#fdfcfa; --tint:#faf5ef; --line:#f3ece5;
}
[data-theme="rose"]{
  --ink:#1a1020; --body:#5c4e58; --muted:#7d6970;
  --brand:#bc4e78; --brand-600:#943358; --brand-100:#f8e7ee;
  --soft:#fcfafb; --tint:#f9f1f4; --line:#f0e7eb;
}
/* Colours ease across a theme change instead of snapping. */
body,.card,.panel,.tab,.btn,.co-list li,header.bar h1,.gate form,
.toolbar input,.field input,.field select,.co-add input{
  transition:background-color .3s var(--e),border-color .3s var(--e),color .3s var(--e);
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                       transition-duration:.01ms!important;scroll-behavior:auto!important}
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--soft);font-family:var(--f-b);color:var(--ink);
     font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-h);margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--brand)}

.top{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
     border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;
        align-items:center;gap:.7rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.5rem;text-decoration:none}
.brand img{width:30px;height:30px;object-fit:contain}
.brand span{font-family:var(--f-script);font-size:21px;line-height:1;color:var(--ink);padding-bottom:.1em}
.top h1{font-size:14px;font-weight:600;color:var(--muted);padding-left:.8rem;
        border-left:1px solid var(--line);flex:1;min-width:80px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     min-height:40px;padding:0 15px;border-radius:var(--r-sm);font-weight:600;
     font-size:13.5px;text-decoration:none;white-space:nowrap;
     transition:background .18s,border-color .18s,color .18s}
.btn:hover{text-decoration:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-pri{background:var(--brand);color:#fff}
.btn-pri:hover:not(:disabled){background:var(--brand-600)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--body)}
.btn-ghost:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn-danger{background:#fff;border:1px solid var(--line);color:var(--muted)}
.btn-danger:hover{border-color:var(--red);color:var(--red)}
.btn-sm{min-height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}

.shell{max-width:1180px;margin:0 auto;padding:22px 18px 80px;display:grid;
       grid-template-columns:246px 1fr;gap:26px;align-items:start}

/* ── sidebar ── */
.side{position:sticky;top:74px}
.search{width:100%;min-height:42px;padding:0 13px;border:1px solid var(--line);
        border-radius:var(--r-sm);background:#fff;outline:none;margin-bottom:14px}
.search:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-mod{padding:9px 12px;border-radius:var(--r-sm);font-weight:700;font-size:13.5px;
         text-align:left;color:var(--body);width:100%}
.nav-mod:hover{background:#fff}
.nav-mod.on{background:var(--ink);color:#fff}
.nav-ses{padding:6px 12px 6px 24px;border-radius:8px;font-size:13px;
         text-align:left;color:var(--muted);width:100%}
.nav-ses:hover{background:#fff;color:var(--brand)}
.nav-ses.on{color:var(--brand);font-weight:600}

/* ── content ── */
.mod-head{margin-bottom:22px}
.mod-head h2{font-size:26px;margin-bottom:5px}
.mod-head p{color:var(--muted);margin:0;font-size:15px}

.ses{background:#fff;border:1px solid var(--line);border-radius:var(--r);
     box-shadow:var(--sh-sm);padding:22px 24px;margin-bottom:18px}
.ses-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ses-head h3{font-size:19px}
.mins{font-size:12px;font-weight:700;color:var(--violet);background:var(--violet-100);
      border-radius:999px;padding:3px 10px}
.goal{background:var(--brand-100);border-radius:var(--r-sm);padding:11px 14px;
      font-size:14px;color:var(--brand-600);margin:10px 0 20px;font-weight:500}

.topic{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.topic:first-of-type{border-top:0;padding-top:0;margin-top:0}
.topic h4{font-size:16.5px;margin-bottom:12px;display:flex;gap:9px;align-items:baseline}
.topic h4 i{font-style:normal;color:var(--brand);font-size:13px;font-weight:700;
            flex-shrink:0;font-family:var(--f-b)}

.line{display:grid;grid-template-columns:86px 1fr;gap:12px;margin-bottom:11px;font-size:14.5px}
.line b{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
        letter-spacing:.05em;padding-top:3px}
.line.say div{font-weight:600;color:var(--ink)}
.line.demo div{background:var(--green-100);color:var(--green-700);border-radius:8px;
               padding:9px 12px;font-size:14px}
.line.depth div{background:var(--amber-100);color:var(--amber);border-radius:8px;
                padding:9px 12px;font-size:13.5px}
.qa{margin-top:13px;border-left:3px solid var(--line);padding-left:14px}
.qa dt{font-weight:600;font-size:14px;margin-top:9px}
.qa dt::before{content:'Q  ';color:var(--brand);font-weight:700}
.qa dd{margin:3px 0 0;font-size:14px;color:var(--body)}

/* ── track ── */
.track{background:#fff;border:1px solid var(--line);border-radius:var(--r);
       box-shadow:var(--sh-sm);padding:20px 22px;margin-bottom:18px}
.wk{display:grid;grid-template-columns:70px 1fr;gap:14px;padding:13px 0;
    border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk .n{font-family:var(--f-h);font-weight:800;color:var(--brand);font-size:14px}
.wk h4{font-size:15.5px;margin-bottom:3px}
.wk p{margin:0;font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;background:var(--soft);border:1px solid var(--line);
      border-radius:999px;padding:3px 10px;color:var(--body)}
.chip:hover{border-color:var(--brand);color:var(--brand)}

.prin{display:grid;gap:10px}
.prin div{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px}
.prin b{display:block;font-family:var(--f-h);font-size:14.5px;margin-bottom:2px}
.prin span{font-size:14px;color:var(--muted)}

/* ── DSA ── */
.dsa-form{background:#fff;border:1px solid var(--line);border-radius:var(--r);
          box-shadow:var(--sh-sm);padding:20px 22px;margin-bottom:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:block;margin-bottom:12px}
.f span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;min-height:42px;padding:9px 12px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;outline:none}
.f textarea{min-height:80px;resize:vertical;line-height:1.6}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}

.dsa-topic{margin-bottom:22px}
.dsa-topic h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.dsa-topic h3 em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted)}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);
   padding:13px 15px;margin-bottom:9px}
.q-top{display:flex;align-items:flex-start;gap:10px}
.q-top h4{font-size:15px;flex:1;min-width:0}
.lvl{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase}
.l-easy{background:var(--green-100);color:var(--green-700)}
.l-medium{background:var(--amber-100);color:var(--amber)}
.l-hard{background:var(--red-100);color:var(--red)}
.q .notes{margin-top:8px;font-size:14px;color:var(--body);white-space:pre-wrap}
.q .acts{margin-top:9px;display:flex;gap:8px;align-items:center}

.msg{padding:11px 14px;border-radius:var(--r-sm);font-size:14px;margin-bottom:14px;
     font-weight:500;display:none}
.msg.show{display:block}
.msg.ok{background:var(--green-100);color:var(--green-700)}
.msg.bad{background:var(--red-100);color:var(--red)}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);
       padding:36px 24px;text-align:center;color:var(--muted)}
.load{padding:60px 0;text-align:center;color:var(--muted)}

.gate{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}
.gate div{background:#fff;border:1px solid var(--line);border-radius:20px;
          box-shadow:var(--sh-md);padding:34px 30px;max-width:380px}
.gate img{width:66px;height:66px;object-fit:contain;margin-bottom:14px}
.gate h2{font-size:20px;margin-bottom:8px}
.gate p{color:var(--muted);font-size:14px;margin:0 0 20px}

@media(max-width:900px){
  .shell{grid-template-columns:1fr;gap:18px}
  .side{position:static}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px}
  .nav-ses{display:none}
  .nav-mod{width:auto;white-space:nowrap;border:1px solid var(--line);background:#fff}
  .grid2{grid-template-columns:1fr}
  .line{grid-template-columns:1fr;gap:3px}
  .line b{padding-top:0}
}
@media print{
  .top,.side,.dsa-form,.q .acts{display:none!important}
  .shell{grid-template-columns:1fr;padding:0}
  .ses,.track,.q{break-inside:avoid;box-shadow:none}
  body{background:#fff;font-size:12pt}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/admin.html">
      <img src="assets/logo-96.png" alt="" aria-hidden="true" width="30" height="30">
      <span>Kanishka Creates</span>
    </a>
    <h1>Teaching plan</h1>
    <button class="btn btn-ghost btn-sm" type="button" onclick="window.print()">Print</button>
    <a class="btn btn-ghost btn-sm" href="/admin.html">Bookings</a>
  </div>
</header>

<div class="gate" id="gate" hidden>
  <div>
    <img src="assets/logo-256.png" alt="" width="66" height="66">
    <h2>Sign in first</h2>
    <p id="gateMsg">This page is part of the admin panel.</p>
    <a class="btn btn-pri" href="/admin.html">Go to sign in</a>
  </div>
</div>

<div class="load" id="load">Loading the plan…</div>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <input class="search" id="search" type="search" placeholder="Search topics…" autocomplete="off">
    <nav class="nav" id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let DATA = null;
let current = 'overview';

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: opts.body ? { 'content-type': 'application/json' } : undefined,
    ...opts,
  });
  let d = {};
  try { d = await res.json(); } catch {}
  if (res.status === 401) { $('#load').hidden = true; $('#shell').hidden = true; $('#gate').hidden = false; throw new Error('Not signed in.'); }
  if (!res.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}

/* ── sidebar ── */
function renderNav() {
  const items = [`<button class="nav-mod ${current === 'overview' ? 'on' : ''}" data-go="overview">Overview &amp; plan</button>`];
  for (const m of DATA.modules) {
    items.push(`<button class="nav-mod ${current === m.id ? 'on' : ''}" data-go="${esc(m.id)}">${esc(m.title)}</button>`);
    if (current === m.id) {
      for (const s of m.sessions) {
        items.push(`<button class="nav-ses" data-scroll="${esc(s.id)}">${esc(s.title)}</button>`);
      }
    }
  }
  $('#nav').innerHTML = items.join('');
}

/* ── a single topic ── */
function topicHtml(t, i) {
  const line = (cls, label, value) => value
    ? `<div class="line ${cls}"><b>${label}</b><div>${esc(value)}</div></div>` : '';

  const qa = (t.ask || []).length
    ? `<dl class="qa">${t.ask.map(([q, a]) => `<dt>${esc(q)}</dt><dd>${esc(a)}</dd>`).join('')}</dl>`
    : '';

  return `
  <div class="topic" data-search="${esc((t.t + ' ' + t.say + ' ' + (t.why || '')).toLowerCase())}">
    <h4><i>${i + 1}</i> ${esc(t.t)}</h4>
    ${line('say', 'Say', t.say)}
    ${line('', 'Why', t.why)}
    ${line('', 'Analogy', t.analogy)}
    ${line('demo', 'Demo', t.demo)}
    ${qa}
    ${line('depth', 'Stop at', t.depth)}
  </div>`;
}

function sessionHtml(s) {
  return `
  <section class="ses" id="${esc(s.id)}">
    <div class="ses-head">
      <h3>${esc(s.title)}</h3>
      <span class="mins">${esc(s.mins)} min</span>
    </div>
    ${s.goal ? `<div class="goal">Goal — ${esc(s.goal)}</div>` : ''}
    ${s.topics.map(topicHtml).join('')}
  </section>`;
}

/* ── overview ── */
function trackHtml(t) {
  return `
  <div class="mod-head" style="margin-top:26px">
    <h2>${esc(t.title)}</h2>
    <p>${esc(t.note)}</p>
  </div>
  <div class="track">
    ${t.weeks.map((w) => `
      <div class="wk">
        <div class="n">Week ${esc(w.week)}</div>
        <div>
          <h4>${esc(w.title)}</h4>
          <p>${esc(w.note)}</p>
          <div class="chips">${w.sessions.map((id) => {
            const found = DATA.modules.flatMap((m) => m.sessions).find((s) => s.id === id);
            return found ? `<button class="chip" data-find="${esc(id)}">${esc(found.title)}</button>` : '';
          }).join('')}</div>
        </div>
      </div>`).join('')}
  </div>`;
}

function overviewHtml() {
  const totals = DATA.modules.reduce((a, m) => {
    a.s += m.sessions.length;
    a.t += m.sessions.reduce((n, s) => n + s.topics.length, 0);
    a.m += m.sessions.reduce((n, s) => n + s.mins, 0);
    return a;
  }, { s: 0, t: 0, m: 0 });

  return `
  <div class="mod-head">
    <h2>The plan</h2>
    <p>${totals.s} sessions, ${totals.t} topics, about ${Math.round(totals.m / 60)} hours of material.
       More than four weekends holds — the tracks below are two ways through it.</p>
  </div>
  ${DATA.tracks.map(trackHtml).join('')}

  <div class="mod-head" style="margin-top:30px"><h2>How to teach it</h2>
    <p>Habits that apply to every session.</p></div>
  <div class="prin">
    ${DATA.principles.map(([a, b]) => `<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}
  </div>`;
}

/* ── DSA ── */
const LVL = ['easy', 'medium', 'hard'];

function dsaHtml() {
  const d = DATA.dsa;
  const list = d.unavailable
    ? `<div class="empty">The question bank needs the database, which is unreachable right now. The teaching notes above still work.</div>`
    : (d.topics.length ? d.topics.map((g) => `
        <div class="dsa-topic">
          <h3>${esc(g.topic)} <em>${g.items.length} question${g.items.length === 1 ? '' : 's'}</em></h3>
          ${g.items.map((q) => `
            <div class="q">
              <div class="q-top">
                <h4>${esc(q.title)}</h4>
                <span class="lvl l-${esc(q.level)}">${esc(q.level)}</span>
              </div>
              ${q.notes ? `<div class="notes">${esc(q.notes)}</div>` : ''}
              <div class="acts">
                ${q.link ? `<a class="btn btn-ghost btn-sm" href="${esc(q.link)}" target="_blank" rel="noopener">Open</a>` : ''}
                <button class="btn btn-danger btn-sm" data-del="${esc(q.id)}">Remove</button>
              </div>
            </div>`).join('')}
        </div>`).join('')
      : `<div class="empty">No questions yet. Add the first one above — topic, title, and whatever you want to remember about it.</div>`);

  return `
  <div class="mod-head">
    <h2>DSA</h2>
    <p>Your own plan and question bank. Everything here is added by you and saved immediately.</p>
  </div>
  <div class="msg" id="dsaMsg"></div>

  <form class="dsa-form" id="dsaForm">
    <div class="grid2">
      <label class="f"><span>Topic</span>
        <input id="dTopic" list="topicList" placeholder="Arrays, Graphs, DP…" required>
        <datalist id="topicList">${(d.topics || []).map((g) => `<option value="${esc(g.topic)}">`).join('')}</datalist>
      </label>
      <label class="f"><span>Difficulty</span>
        <select id="dLevel">${LVL.map((l) => `<option value="${l}"${l === 'medium' ? ' selected' : ''}>${l}</option>`).join('')}</select>
      </label>
    </div>
    <label class="f"><span>Question</span>
      <input id="dTitle" placeholder="Two Sum — find a pair adding to a target" required></label>
    <label class="f"><span>Link (optional)</span>
      <input id="dLink" type="url" placeholder="https://leetcode.com/problems/two-sum/"></label>
    <label class="f"><span>Your plan / notes (optional)</span>
      <textarea id="dNotes" placeholder="Approach to teach, the hint to give, the follow-up to ask…"></textarea></label>
    <button class="btn btn-pri" type="submit" id="dBtn">Add question</button>
  </form>

  ${list}`;
}

/* ── routing ── */
function renderMain() {
  if (current === 'overview') { $('#main').innerHTML = overviewHtml(); return; }

  const m = DATA.modules.find((x) => x.id === current);
  if (!m) return;

  if (m.ownerEditable) { $('#main').innerHTML = dsaHtml(); return; }

  $('#main').innerHTML = `
    <div class="mod-head"><h2>${esc(m.title)}</h2><p>${esc(m.blurb)}</p></div>
    ${m.sessions.map(sessionHtml).join('')}`;
}

function go(id, scrollTo) {
  current = id;
  renderNav();
  renderMain();
  if (scrollTo) {
    const el = document.getElementById(scrollTo);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

document.addEventListener('click', async (e) => {
  const nav = e.target.closest('[data-go]');
  if (nav) return go(nav.dataset.go);

  const sc = e.target.closest('[data-scroll]');
  if (sc) {
    const el = document.getElementById(sc.dataset.scroll);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }

  // A week chip jumps to whichever module owns that session.
  const find = e.target.closest('[data-find]');
  if (find) {
    const id = find.dataset.find;
    const mod = DATA.modules.find((m) => m.sessions.some((s) => s.id === id));
    if (mod) { go(mod.id); setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' }), 60); }
    return;
  }

  const del = e.target.closest('[data-del]');
  if (del) {
    if (!confirm('Remove this question?')) return;
    del.disabled = true;
    try {
      const out = await api('/api/admin/curriculum', {
        method: 'DELETE', body: JSON.stringify({ id: del.dataset.del }),
      });
      DATA.dsa = out.dsa;
      renderMain();
    } catch (err) {
      alert(err.message);
      del.disabled = false;
    }
  }
});

document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'dsaForm') return;
  e.preventDefault();

  const btn = $('#dBtn');
  btn.disabled = true;
  try {
    const out = await api('/api/admin/curriculum', {
      method: 'POST',
      body: JSON.stringify({
        topic: $('#dTopic').value, title: $('#dTitle').value,
        level: $('#dLevel').value, link: $('#dLink').value, notes: $('#dNotes').value,
      }),
    });
    const keepTopic = $('#dTopic').value;
    DATA.dsa = out.dsa;
    renderMain();
    // Keep the topic so a run of questions on one topic stays quick to enter.
    $('#dTopic').value = keepTopic;
    $('#dTitle').focus();
    const m = $('#dsaMsg');
    m.className = 'msg ok show'; m.textContent = 'Added.';
    setTimeout(() => { m.className = 'msg'; }, 2500);
  } catch (err) {
    const m = $('#dsaMsg');
    if (m) { m.className = 'msg bad show'; m.textContent = err.message; }
    btn.disabled = false;
  }
});

/* ── search ── */
$('#search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) {
    document.querySelectorAll('.topic,.ses').forEach((el) => { el.hidden = false; });
    return;
  }
  document.querySelectorAll('.ses').forEach((ses) => {
    let any = false;
    ses.querySelectorAll('.topic').forEach((t) => {
      const hit = (t.dataset.search || '').includes(q);
      t.hidden = !hit;
      if (hit) any = true;
    });
    ses.hidden = !any;
  });
});

/* ── boot ── */
(async function init() {
  try {
    DATA = await api('/api/admin/curriculum');
    $('#load').hidden = true;
    $('#shell').hidden = false;
    renderNav();
    renderMain();
  } catch (err) {
    $('#load').hidden = true;
    if ($('#gate').hidden) {
      $('#gate').hidden = false;
      $('#gateMsg').textContent = err.message;
    }
  }
})();
</script>
</body>
</html>
