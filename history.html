<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faeff4">
<meta name="robots" content="noindex">
<title>Your bookings — Kanishka Creates</title>
<link rel="icon" type="image/png" sizes="96x96" href="assets/logo-96.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --white:#fff; --soft:#fdf9fb; --tint:#faeff4;
  --ink:#1a1020; --body:#5c4e58; --muted:#7d6970; --line:#f2e9ec;
  --brand:#bd517b; --brand-600:#95375b; --brand-100:#f8e7ee;
  --violet:#8b60c7; --violet-100:#f0e9fe;
  --accent-100:#fef4e3; --accent-700:#a86a00;
  --green:#16a34a; --green-100:#e7f7ed; --green-700:#12703a;
  --red:#dc2626; --red-100:#fdeaea;
  --r-sm:12px; --r:18px; --r-lg:24px;
  --sh-sm:0 2px 10px rgba(60,20,40,.05);
  --sh-md:0 14px 40px rgba(60,20,40,.10);
  --e:cubic-bezier(.22,.9,.3,1);
  --f-h:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-script:'Great Vibes','Segoe Script',cursive;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--soft);font-family:var(--f-b);color:var(--ink);
     font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-h);margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}

.top{background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
     border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.top-in{max-width:840px;margin:0 auto;padding:13px 18px;display:flex;
        align-items:center;gap:.6rem}
.brand{display:flex;align-items:center;gap:.55rem;flex:1;min-width:0}
.brand:hover{text-decoration:none}
.brand img{width:32px;height:32px;object-fit:contain;flex-shrink:0}
.brand span{font-family:var(--f-script);font-size:22px;line-height:1;color:var(--ink);
            padding-bottom:.1em;white-space:nowrap}
.wrap{max-width:840px;margin:0 auto;padding:28px 18px 80px}

/* ── buttons: one size, real touch targets, no width jump while loading ── */
.btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  gap:.5rem; min-height:50px; padding:0 22px; border-radius:var(--r-sm);
  font-weight:600; font-size:15px; white-space:nowrap; text-decoration:none;
  transition:background .18s var(--e), color .18s var(--e),
             border-color .18s var(--e), transform .12s var(--e), box-shadow .18s var(--e);
}
.btn:hover{text-decoration:none}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--brand-100),0 0 0 4px var(--brand)}
.btn:disabled{cursor:not-allowed;opacity:.6}

.btn-pri{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(189,81,123,.28)}
.btn-pri:hover:not(:disabled){background:var(--brand-600);box-shadow:0 8px 22px rgba(189,81,123,.34)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--body)}
.btn-ghost:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn-wide{width:100%}
.btn-sm{min-height:40px;padding:0 15px;font-size:14px;border-radius:10px}

/* Spinner replaces the label in place, so the button never resizes. */
.btn[data-busy="1"]{color:transparent!important;pointer-events:none}
.btn[data-busy="1"]::after{
  content:'';position:absolute;width:18px;height:18px;border-radius:50%;
  border:2px solid currentColor;border-top-color:transparent;
  color:#fff;animation:spin .6s linear infinite;
}
.btn-ghost[data-busy="1"]::after{color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── the sign-in card ── */
.gate{display:grid;place-items:center;padding:min(7vh,54px) 0}
.card-auth{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--sh-md);padding:34px 30px;width:100%;max-width:420px;text-align:center;
}
.card-auth img.mk{width:66px;height:66px;object-fit:contain;margin-bottom:16px}
.card-auth h1{font-size:23px;margin-bottom:8px}
.card-auth .lead{color:var(--muted);font-size:14.5px;margin:0 0 24px;line-height:1.6}

.step{animation:rise .34s var(--e) both}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .step{animation:none}
  .btn:active:not(:disabled){transform:none}
}

.field{display:block;text-align:left;margin-bottom:14px}
.field > span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:7px}
.field input{
  width:100%;min-height:50px;padding:0 15px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#fff;outline:none;
  transition:border-color .18s var(--e),box-shadow .18s var(--e);
}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.field input::placeholder{color:#c5b3bb}

#code{
  letter-spacing:.5em; text-align:center; font-size:24px; font-weight:600;
  font-family:ui-monospace,Menlo,monospace; padding-left:.5em; min-height:60px;
}
#code.is-bad{border-color:var(--red);animation:shake .34s}
@keyframes shake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)}
  40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}

.mailto{
  display:inline-flex;align-items:center;gap:.45rem;background:var(--brand-100);
  color:var(--brand-600);border-radius:999px;padding:7px 14px;font-size:13.5px;
  font-weight:600;margin-bottom:20px;max-width:100%;
}
.mailto b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alt{margin:16px 0 0;font-size:13.5px;color:var(--muted)}
.alt button{color:var(--brand);font-weight:600;padding:4px 2px}
.alt button:hover{text-decoration:underline}
.alt button:disabled{color:var(--muted);cursor:not-allowed;text-decoration:none}
.dot-sep{opacity:.45;margin:0 .3rem}

/* ── bookings ── */
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.head h1{font-size:24px}
.head p{color:var(--muted);font-size:14px;margin:2px 0 0;word-break:break-word}
.head .btn{margin-left:auto}

.sec{margin-bottom:32px}
.sec h2{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:13px;
        text-transform:uppercase;letter-spacing:.06em}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);
      box-shadow:var(--sh-sm);padding:18px 20px;margin-bottom:12px;
      transition:box-shadow .2s var(--e),transform .2s var(--e)}
.card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.card-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card h3{font-size:16.5px;flex:1;min-width:150px}
.ref{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11px;
     color:var(--muted);background:var(--soft);border:1px solid var(--line);
     border-radius:6px;padding:2px 8px;margin-top:6px}
.pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;
      letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.p-await{background:var(--accent-100);color:var(--accent-700)}
.p-pending{background:var(--violet-100);color:var(--violet)}
.p-confirmed{background:var(--green-100);color:var(--green-700)}
.p-cancelled{background:var(--red-100);color:var(--red)}
.p-new{background:var(--brand-100);color:var(--brand-600)}

.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
      gap:12px 18px;margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}
.rows div span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.rows div b{font-weight:600;font-size:14.5px}
.quote{margin-top:13px;background:var(--soft);border:1px solid var(--line);
       border-radius:var(--r-sm);padding:12px 14px;font-size:14px;color:var(--body);
       white-space:pre-wrap;word-break:break-word}
.hint{font-size:13.5px;color:var(--muted);margin:12px 0 0}

.msg{padding:12px 15px;border-radius:var(--r-sm);font-size:14px;margin-bottom:16px;
     font-weight:500;text-align:left;display:none;animation:rise .26s var(--e) both}
.msg.show{display:block}
.msg.bad{background:var(--red-100);color:var(--red)}
.msg.ok{background:var(--green-100);color:var(--green-700)}

/* ── nothing booked yet ── */
.blank{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
       box-shadow:var(--sh-sm);padding:46px 28px;text-align:center}
.blank .emo{font-size:40px;line-height:1;margin-bottom:14px}
.blank h2{font-size:20px;margin-bottom:8px}
.blank p{color:var(--muted);font-size:15px;margin:0 auto 24px;max-width:38ch;line-height:1.65}
.blank .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.skel{height:104px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:12px;
      background:linear-gradient(90deg,#fff,var(--soft),#fff);background-size:200% 100%;
      animation:sh 1.25s infinite}
@keyframes sh{to{background-position:-200% 0}}

@media(max-width:560px){
  .wrap{padding:20px 14px 60px}
  .card-auth{padding:28px 22px}
  .head .btn{margin-left:0}
  .blank .acts .btn{width:100%}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/">
      <img src="assets/logo-96.png" srcset="assets/logo-96.png 1x, assets/logo-256.png 2x"
           alt="" aria-hidden="true" width="32" height="32" decoding="async">
      <span>Kanishka Creates</span>
    </a>
    <a class="btn btn-ghost btn-sm" href="/">Back to site</a>
  </div>
</header>

<div class="wrap">

  <!-- ── email ── -->
  <section class="gate" id="stepEmail" hidden>
    <form class="card-auth step" id="emailForm" novalidate>
      <img class="mk" src="assets/logo-256.png" alt="Kanishka Creates" width="66" height="66">
      <h1>Your bookings</h1>
      <p class="lead">Enter the email you booked with and we'll send you a code.</p>
      <div class="msg bad" id="emailMsg"></div>
      <label class="field">
        <span>Email address</span>
        <input type="email" id="email" autocomplete="email" inputmode="email"
               required placeholder="you@example.com">
      </label>
      <button class="btn btn-pri btn-wide" type="submit" id="emailBtn">Continue</button>
    </form>
  </section>

  <!-- ── code ── -->
  <section class="gate" id="stepCode" hidden>
    <form class="card-auth step" id="codeForm" novalidate>
      <img class="mk" src="assets/logo-256.png" alt="Kanishka Creates" width="66" height="66">
      <h1>Enter your code</h1>
      <p class="lead">We sent a 6-digit code. It opens your bookings straight away.</p>
      <div class="mailto"><span>✉</span><b id="sentTo"></b></div>
      <div class="msg bad" id="codeMsg"></div>
      <label class="field">
        <span>6-digit code</span>
        <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" pattern="[0-9]*" required placeholder="······" aria-describedby="codeMsg">
      </label>
      <button class="btn btn-pri btn-wide" type="submit" id="codeBtn">Open my bookings</button>
      <p class="alt">
        <button type="button" id="resendBtn">Resend code</button>
        <span class="dot-sep">·</span>
        <button type="button" id="changeBtn">Change email</button>
      </p>
    </form>
  </section>

  <!-- ── bookings ── -->
  <section id="view" hidden>
    <div class="head">
      <div>
        <h1 id="hi">Your bookings</h1>
        <p id="who"></p>
      </div>
      <button class="btn btn-ghost btn-sm" type="button" id="outBtn">Sign out</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="body"></div>
  </section>

</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let pendingEmail = '';
let verifying = false;

function show(which) {
  for (const id of ['stepEmail', 'stepCode', 'view']) {
    const el = $('#' + id);
    const on = id === which;
    // Re-trigger the entrance animation each time a step becomes visible.
    if (on && el.hidden) {
      const inner = el.querySelector('.step');
      if (inner) { inner.style.animation = 'none'; void inner.offsetWidth; inner.style.animation = ''; }
    }
    el.hidden = !on;
  }
}

function note(sel, text, kind) {
  const el = $(sel);
  el.className = 'msg ' + kind + (text ? ' show' : '');
  el.textContent = text || '';
}

/** Swap a button into its spinner state without letting it change width. */
function busy(sel, on) {
  const b = $(sel);
  if (on) { b.dataset.busy = '1'; b.disabled = true; }
  else { delete b.dataset.busy; b.disabled = false; }
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: opts.body ? { 'content-type': 'application/json' } : undefined,
    ...opts,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');
  return data;
}

/* ── email step ── */
$('#emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('#email').value.trim().toLowerCase();
  if (!email || !email.includes('@')) {
    return note('#emailMsg', 'Please enter a valid email address.', 'bad');
  }
  note('#emailMsg', '', 'bad');
  busy('#emailBtn', true);
  try {
    await api('/api/history/session', { method: 'POST', body: JSON.stringify({ email }) });
    pendingEmail = email;
    $('#sentTo').textContent = email;
    $('#code').value = '';
    show('stepCode');
    setTimeout(() => $('#code').focus(), 220);
  } catch (err) {
    note('#emailMsg', err.message, 'bad');
  } finally {
    busy('#emailBtn', false);
  }
});

/* ── code step ── */
async function submitCode() {
  if (verifying) return;
  const code = $('#code').value.replace(/\D/g, '');
  if (code.length !== 6) return note('#codeMsg', 'Enter all 6 digits.', 'bad');

  verifying = true;
  note('#codeMsg', '', 'bad');
  busy('#codeBtn', true);
  try {
    await api('/api/history/session', {
      method: 'PUT', body: JSON.stringify({ email: pendingEmail, code }),
    });
    $('#code').value = '';
    await load();
  } catch (err) {
    const el = $('#code');
    el.classList.add('is-bad');
    setTimeout(() => el.classList.remove('is-bad'), 400);
    el.value = '';
    el.focus();
    note('#codeMsg', err.message, 'bad');
  } finally {
    verifying = false;
    busy('#codeBtn', false);
  }
}

$('#codeForm').addEventListener('submit', (e) => { e.preventDefault(); submitCode(); });

// Digits only, and submit the moment all six are in — nobody should have to
// read a code, type it, then go hunting for a button.
$('#code').addEventListener('input', (e) => {
  const cleaned = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (cleaned !== e.target.value) e.target.value = cleaned;
  if (cleaned.length === 6) submitCode();
});

$('#resendBtn').addEventListener('click', async () => {
  const btn = $('#resendBtn');
  btn.disabled = true;
  note('#codeMsg', '', 'bad');
  try {
    await api('/api/history/session', { method: 'POST', body: JSON.stringify({ email: pendingEmail }) });
    note('#codeMsg', 'New code sent. Check your inbox.', 'ok');
  } catch (err) {
    note('#codeMsg', err.message, 'bad');
  }
  // The server throttles resends to once a minute; mirror that here so the
  // button cannot be hammered into an error message.
  let left = 60;
  btn.textContent = `Resend in ${left}s`;
  const tick = setInterval(() => {
    left -= 1;
    if (left <= 0) {
      clearInterval(tick);
      btn.textContent = 'Resend code';
      btn.disabled = false;
    } else {
      btn.textContent = `Resend in ${left}s`;
    }
  }, 1000);
});

$('#changeBtn').addEventListener('click', () => {
  note('#emailMsg', '', 'bad');
  show('stepEmail');
  setTimeout(() => $('#email').focus(), 220);
});

$('#outBtn').addEventListener('click', async () => {
  try { await api('/api/history/session', { method: 'DELETE' }); } catch {}
  pendingEmail = '';
  $('#email').value = '';
  show('stepEmail');
});

/* ── render ── */
const PILL = {
  awaiting_confirmation: ['p-await', 'Awaiting confirmation'],
  pending:               ['p-pending', 'Awaiting payment'],
  confirmed:             ['p-confirmed', 'Confirmed'],
  cancelled:             ['p-cancelled', 'Cancelled'],
};
const fmt = (d) => {
  if (!d) return '';
  const dt = new Date(d);
  return isNaN(dt) ? '' : dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
};

function bookingCard(b) {
  const [cls, label] = PILL[b.status] || ['p-pending', b.status];
  const when = b.kind === 'trial'
    ? `${esc(b.dateLabel)} · ${esc(b.timeLabel)} IST`
    : `${esc(b.dateLabel)} → ${esc(b.endDateLabel)}`;
  const paid = b.amountPaid != null ? b.amountPaid : null;

  return `
  <article class="card">
    <div class="card-top">
      <div>
        <h3>${esc(b.planLabel)}</h3>
        <span class="ref">${esc(b.bookingId)}</span>
      </div>
      <span class="pill ${cls}">${esc(label)}</span>
    </div>
    <div class="rows">
      <div><span>Attending</span><b>${esc(b.modeLabel)}</b></div>
      <div><span>${b.kind === 'trial' ? 'Date &amp; time' : 'Runs'}</span><b>${when}</b></div>
      <div><span>${paid != null ? 'Paid' : 'Amount'}</span><b>₹${esc(paid != null ? paid : b.amount)}</b></div>
      <div><span>Booked on</span><b>${esc(fmt(b.createdAt))}</b></div>
    </div>
    ${b.topic ? `<div class="quote">${esc(b.topic)}</div>` : ''}
    ${b.status === 'awaiting_confirmation'
      ? `<p class="hint">We'll confirm on WhatsApp once your payment reaches us.</p>` : ''}
  </article>`;
}

function enquiryCard(c) {
  return `
  <article class="card">
    <div class="card-top">
      <h3>${esc(c.service || 'Project enquiry')}</h3>
      <span class="pill p-new">${esc(c.status === 'new' ? 'Received' : c.status)}</span>
    </div>
    <div class="rows">
      ${c.budget ? `<div><span>Budget</span><b>${esc(c.budget)}</b></div>` : ''}
      <div><span>Sent on</span><b>${esc(fmt(c.createdAt))}</b></div>
    </div>
    ${c.message ? `<div class="quote">${esc(c.message)}</div>` : ''}
  </article>`;
}

function render(data) {
  const first = String(data.name || '').split(' ')[0];
  $('#hi').textContent = first ? `Hi, ${first}` : 'Your bookings';
  $('#who').textContent = data.email;

  const parts = [];
  if (data.bookings.length) {
    parts.push(`<section class="sec"><h2>Sessions</h2>${data.bookings.map(bookingCard).join('')}</section>`);
  }
  if (data.enquiries.length) {
    parts.push(`<section class="sec"><h2>Project enquiries</h2>${data.enquiries.map(enquiryCard).join('')}</section>`);
  }

  $('#body').innerHTML = parts.length ? parts.join('') : `
    <div class="blank">
      <div class="emo">📅</div>
      <h2>No bookings yet</h2>
      <p>Nothing booked on this email. Start with a one-hour trial for ₹200 and
         see whether it's worth your time.</p>
      <div class="acts">
        <a class="btn btn-pri" href="/#booking">Book a consultation</a>
        <a class="btn btn-ghost" href="/#contact">Send a project enquiry</a>
      </div>
    </div>`;
}

async function load() {
  show('view');
  $('#body').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  note('#msg', '', 'bad');
  try {
    render(await api('/api/history/me'));
  } catch (err) {
    $('#body').innerHTML = '';
    note('#emailMsg', err.message, 'bad');
    show('stepEmail');
  }
}

/* ── boot ── */
(async function init() {
  try {
    const s = await api('/api/history/session');
    if (s.signedIn) return load();
  } catch {}
  show('stepEmail');
  setTimeout(() => $('#email').focus(), 120);
})();
</script>
</body>
</html>
