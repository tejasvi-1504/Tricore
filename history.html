<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#faeff4">
<meta name="robots" content="noindex">
<title>Your history — Kanishka Creates</title>
<link rel="icon" type="image/png" sizes="96x96" href="assets/logo-96.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --white:#fff; --soft:#fdf9fb; --tint:#faeff4;
  --ink:#1a1020; --body:#5c4e58; --muted:#7d6970; --line:#f2e9ec;
  --brand:#bd517b; --brand-600:#95375b; --brand-100:#f8e7ee;
  --violet:#8b60c7; --violet-100:#f0e9fe;
  --accent-100:#fef4e3; --accent-700:#a86a00;
  --green:#16a34a; --green-100:#e7f7ed; --green-700:#12703a;
  --red:#dc2626; --red-100:#fdeaea;
  --r-sm:10px; --r:16px; --r-lg:22px;
  --sh-sm:0 2px 8px rgba(60,20,40,.06);
  --sh-md:0 8px 24px rgba(60,20,40,.08);
  --f-h:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-script:'Great Vibes','Segoe Script',cursive;
}
*,*::before,*::after{box-sizing:border-box}
/* Views are toggled with the `hidden` attribute and carry their own display
   values, which would otherwise outrank the UA sheet's [hidden] rule. */
[hidden]{display:none!important}
body{margin:0;background:var(--soft);font-family:var(--f-b);color:var(--ink);
     font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-h);margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit;color:inherit}
a{color:var(--brand)}

.top{background:#fff;border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:14px 18px;display:flex;
        align-items:center;gap:.6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;flex:1;min-width:0}
.brand img{width:32px;height:32px;object-fit:contain;flex-shrink:0}
.brand span{font-family:var(--f-script);font-size:22px;line-height:1;color:var(--ink);
            padding-bottom:.1em;white-space:nowrap}
.wrap{max-width:860px;margin:0 auto;padding:26px 18px 70px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
     padding:11px 18px;border-radius:var(--r-sm);font-weight:600;font-size:14px;
     text-decoration:none;white-space:nowrap;transition:filter .15s,opacity .15s}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.06)}
.btn-pri{background:var(--brand);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--body)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-wide{width:100%}

/* ── sign in ── */
.gate{display:grid;place-items:center;padding:30px 0}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
           box-shadow:var(--sh-md);padding:32px 28px;width:100%;max-width:410px;text-align:center}
.gate-card img{width:72px;height:72px;object-fit:contain;margin-bottom:14px}
.gate-card h1{font-size:21px;margin-bottom:7px}
.gate-card p.lead{color:var(--muted);font-size:14px;margin:0 0 22px}
.field{display:block;text-align:left;margin-bottom:14px}
.field span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1px solid var(--line);
             border-radius:var(--r-sm);background:#fff;outline:none}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
#code{letter-spacing:.42em;text-align:center;font-size:21px;font-weight:600;
      font-family:ui-monospace,Menlo,monospace;padding-left:.42em}
.sent-to{background:var(--brand-100);color:var(--brand-600);border-radius:var(--r-sm);
         padding:9px 12px;font-size:13px;font-weight:500;margin-bottom:16px;word-break:break-word}
.gate-alt{margin-top:16px;font-size:13px;color:var(--muted)}
.gate-alt button{color:var(--brand);font-weight:600;text-decoration:underline}

/* ── history ── */
.head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:23px}
.head p{color:var(--muted);font-size:14px;margin:3px 0 0;word-break:break-word}
.head .btn{margin-left:auto}

.sec{margin-bottom:30px}
.sec h2{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:12px;
        display:flex;align-items:center;gap:8px}
.sec h2 b{background:var(--brand-100);color:var(--brand-600);border-radius:999px;
          padding:1px 9px;font-size:12px}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);
      box-shadow:var(--sh-sm);padding:17px 19px;margin-bottom:12px}
.card-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.card h3{font-size:16px;flex:1;min-width:150px}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--muted);
     background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;
      letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.p-await{background:var(--accent-100);color:var(--accent-700)}
.p-pending{background:var(--violet-100);color:var(--violet)}
.p-confirmed{background:var(--green-100);color:var(--green-700)}
.p-cancelled{background:var(--red-100);color:var(--red)}
.p-new{background:var(--brand-100);color:var(--brand-600)}

.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
      gap:11px 18px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.rows div span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.rows div b{font-weight:600;font-size:14px}
.quote{margin-top:12px;background:var(--soft);border:1px solid var(--line);
       border-radius:var(--r-sm);padding:11px 13px;font-size:14px;color:var(--body);
       white-space:pre-wrap;word-break:break-word}
.hint{font-size:13px;color:var(--muted);margin-top:11px}

.msg{padding:11px 14px;border-radius:var(--r-sm);font-size:13.5px;margin-bottom:14px;
     font-weight:500;text-align:left;display:none}
.msg.show{display:block}
.msg.bad{background:var(--red-100);color:var(--red)}
.msg.ok{background:var(--green-100);color:var(--green-700)}

.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);
       padding:30px 22px;text-align:center;color:var(--muted);font-size:14px}
.empty a{font-weight:600}
.skel{height:92px;border-radius:var(--r);border:1px solid var(--line);margin-bottom:12px;
      background:linear-gradient(90deg,#fff,var(--soft),#fff);background-size:200% 100%;
      animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:560px){
  .wrap{padding:20px 13px 56px}
  .head .btn{margin-left:0}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="brand" href="/">
      <img src="assets/logo-96.png" srcset="assets/logo-96.png 1x, assets/logo-256.png 2x"
           alt="" aria-hidden="true" width="32" height="32" decoding="async">
      <span>Kanishka Creates</span>
    </a>
    <a class="btn btn-ghost btn-sm" href="/">Back to site</a>
  </div>
</header>

<div class="wrap">

  <!-- ── step 1: email ── -->
  <section class="gate" id="stepEmail" hidden>
    <form class="gate-card" id="emailForm">
      <img src="assets/logo-256.png" alt="Kanishka Creates" width="72" height="72">
      <h1>Your history</h1>
      <p class="lead">See every session you've booked and every enquiry you've sent.
         Enter your email and we'll send a one-time code.</p>
      <div class="msg bad" id="emailMsg"></div>
      <label class="field">
        <span>Email address</span>
        <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
      </label>
      <button class="btn btn-pri btn-wide" type="submit" id="emailBtn">Send me a code</button>
    </form>
  </section>

  <!-- ── step 2: code ── -->
  <section class="gate" id="stepCode" hidden>
    <form class="gate-card" id="codeForm">
      <img src="assets/logo-256.png" alt="Kanishka Creates" width="72" height="72">
      <h1>Check your email</h1>
      <p class="lead">We sent a 6-digit code. It expires in 10 minutes.</p>
      <div class="sent-to" id="sentTo"></div>
      <div class="msg bad" id="codeMsg"></div>
      <label class="field">
        <span>6-digit code</span>
        <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" pattern="[0-9]*" required placeholder="000000">
      </label>
      <button class="btn btn-pri btn-wide" type="submit" id="codeBtn">See my history</button>
      <p class="gate-alt">
        Didn't get it? <button type="button" id="resendBtn">Send again</button>
        · <button type="button" id="changeBtn">Use another email</button>
      </p>
    </form>
  </section>

  <!-- ── history ── -->
  <section id="view" hidden>
    <div class="head">
      <div>
        <h1 id="hi">Your history</h1>
        <p id="who"></p>
      </div>
      <button class="btn btn-ghost btn-sm" type="button" id="outBtn">Sign out</button>
    </div>
    <div class="msg" id="msg"></div>
    <div id="body"></div>
  </section>

</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let pendingEmail = '';

function show(which) {
  for (const id of ['stepEmail', 'stepCode', 'view']) $('#' + id).hidden = id !== which;
}
function note(sel, text, kind) {
  const el = $(sel);
  el.className = 'msg ' + kind + (text ? ' show' : '');
  el.textContent = text || '';
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: opts.body ? { 'content-type': 'application/json' } : undefined,
    ...opts,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

/* ── step 1 ── */
$('#emailForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#emailBtn');
  const email = $('#email').value.trim().toLowerCase();
  note('#emailMsg', '', 'bad');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await api('/api/history/session', { method: 'POST', body: JSON.stringify({ email }) });
    pendingEmail = email;
    $('#sentTo').textContent = 'Code sent to ' + email;
    show('stepCode');
    $('#code').focus();
  } catch (err) {
    note('#emailMsg', err.message, 'bad');
  } finally {
    btn.disabled = false; btn.textContent = 'Send me a code';
  }
});

/* ── step 2 ── */
$('#codeForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#codeBtn');
  note('#codeMsg', '', 'bad');
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    await api('/api/history/session', {
      method: 'PUT',
      body: JSON.stringify({ email: pendingEmail, code: $('#code').value }),
    });
    $('#code').value = '';
    await load();
  } catch (err) {
    note('#codeMsg', err.message, 'bad');
  } finally {
    btn.disabled = false; btn.textContent = 'See my history';
  }
});

$('#resendBtn').addEventListener('click', async () => {
  note('#codeMsg', '', 'bad');
  try {
    await api('/api/history/session', { method: 'POST', body: JSON.stringify({ email: pendingEmail }) });
    note('#codeMsg', 'Sent again — check your inbox.', 'ok');
  } catch (err) {
    note('#codeMsg', err.message, 'bad');
  }
});

$('#changeBtn').addEventListener('click', () => {
  note('#emailMsg', '', 'bad');
  show('stepEmail');
  $('#email').focus();
});

$('#outBtn').addEventListener('click', async () => {
  try { await api('/api/history/session', { method: 'DELETE' }); } catch {}
  pendingEmail = '';
  show('stepEmail');
});

/* ── render ── */
const PILL = {
  awaiting_confirmation: ['p-await', 'Awaiting confirmation'],
  pending:               ['p-pending', 'Awaiting payment'],
  confirmed:             ['p-confirmed', 'Confirmed'],
  cancelled:             ['p-cancelled', 'Cancelled'],
};
const fmt = (d) => {
  if (!d) return '';
  const dt = new Date(d);
  return isNaN(dt) ? '' : dt.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
};

function bookingCard(b) {
  const [cls, label] = PILL[b.status] || ['p-pending', b.status];
  const when = b.kind === 'trial'
    ? `${esc(b.dateLabel)} · ${esc(b.timeLabel)} IST`
    : `${esc(b.dateLabel)} → ${esc(b.endDateLabel)}`;
  const paid = b.amountPaid != null ? b.amountPaid : null;

  return `
  <article class="card">
    <div class="card-top">
      <h3>${esc(b.planLabel)}</h3>
      <span class="pill ${cls}">${esc(label)}</span>
    </div>
    <span class="ref">${esc(b.bookingId)}</span>
    <div class="rows">
      <div><span>Attending</span><b>${esc(b.modeLabel)}</b></div>
      <div><span>${b.kind === 'trial' ? 'Date &amp; time' : 'Runs'}</span><b>${when}</b></div>
      <div><span>${paid != null ? 'Paid' : 'Amount'}</span><b>₹${esc(paid != null ? paid : b.amount)}</b></div>
      <div><span>Booked on</span><b>${esc(fmt(b.createdAt))}</b></div>
    </div>
    ${b.topic ? `<div class="quote">${esc(b.topic)}</div>` : ''}
    ${b.status === 'awaiting_confirmation'
      ? `<p class="hint">We'll confirm this on WhatsApp once your payment is received.</p>` : ''}
  </article>`;
}

function enquiryCard(c) {
  return `
  <article class="card">
    <div class="card-top">
      <h3>${esc(c.service || 'Project enquiry')}</h3>
      <span class="pill p-new">${esc(c.status === 'new' ? 'Received' : c.status)}</span>
    </div>
    <div class="rows">
      ${c.budget ? `<div><span>Budget</span><b>${esc(c.budget)}</b></div>` : ''}
      <div><span>Sent on</span><b>${esc(fmt(c.createdAt))}</b></div>
    </div>
    ${c.message ? `<div class="quote">${esc(c.message)}</div>` : ''}
  </article>`;
}

function render(data) {
  const first = String(data.name || '').split(' ')[0];
  $('#hi').textContent = first ? `Hello, ${first}` : 'Your history';
  $('#who').textContent = data.email;

  const parts = [];
  if (data.bookings.length) {
    parts.push(`<section class="sec"><h2>Sessions <b>${data.bookings.length}</b></h2>
                ${data.bookings.map(bookingCard).join('')}</section>`);
  }
  if (data.enquiries.length) {
    parts.push(`<section class="sec"><h2>Project enquiries <b>${data.enquiries.length}</b></h2>
                ${data.enquiries.map(enquiryCard).join('')}</section>`);
  }
  $('#body').innerHTML = parts.length ? parts.join('') : `
    <div class="empty">
      <p>Nothing on file for this email yet.</p>
      <p><a href="/#booking">Book a session</a> or <a href="/#contact">send an enquiry</a> to get started.</p>
    </div>`;
}

async function load() {
  show('view');
  $('#body').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  note('#msg', '', 'bad');
  try {
    render(await api('/api/history/me'));
  } catch (err) {
    $('#body').innerHTML = '';
    note('#msg', err.message, 'bad');
    show('stepEmail');
  }
}

/* ── boot ── */
(async function init() {
  try {
    const s = await api('/api/history/session');
    if (s.signedIn) return load();
  } catch {}
  show('stepEmail');
})();
</script>
</body>
</html>
