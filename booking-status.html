<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fdeef4">
<meta name="robots" content="noindex">
<title>Booking status — Kanishka Creates</title>
<link rel="icon" type="image/png" sizes="96x96" href="assets/logo-96.png">
<link rel="apple-touch-icon" href="assets/logo-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --white:#fff; --soft:#fdf6f9; --ink:#1f1220; --body:#6b5560; --muted:#7d6970;
  --line:#f2e3ea; --brand:#e11d63; --brand-600:#ad1250; --brand-100:#fdeaf2;
  --accent:#f5a524; --green:#16a34a; --green-100:#e7f7ed;
  --f-h:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-b:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --sh:0 18px 48px rgba(60,20,40,.12);
  --e:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}*{margin:0;padding:0}
body{
  background:linear-gradient(180deg,#fdeef4 0%,#fff 55%);
  color:var(--body);font-family:var(--f-b);font-size:16px;line-height:1.65;
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:1.5rem;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
svg{display:block}
h1{font-family:var(--f-h);color:var(--ink);font-weight:800;letter-spacing:-.03em;line-height:1.2}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;
    stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.card{width:100%;max-width:30rem;background:#fff;border:1px solid var(--line);
      border-radius:28px;box-shadow:var(--sh);overflow:hidden}
.card-hd{display:flex;align-items:center;gap:.6rem;padding:1.15rem 1.75rem;
         border-bottom:1px solid var(--line);background:var(--soft)}
.mk{width:24px;height:24px}
.name{font-family:var(--f-h);font-weight:800;font-size:1.2rem;color:var(--ink);letter-spacing:-.03em}
.body{padding:2.5rem 1.75rem}

.mark{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;
      margin:0 auto 1.4rem;background:var(--brand-100);color:var(--brand)}
.mark .ic{width:1.9em;height:1.9em;stroke-width:2.6}
.mark.ok{background:var(--green-100);color:var(--green)}
.mark.fail{background:#fff0f3;color:#b8123f}
.mark.wait .ic{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

h1{font-size:1.6rem;margin-bottom:.6rem;text-align:center}
.msg{font-size:.95rem;text-align:center}

dl{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:1.75rem}
dl div{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 1rem;
       border-bottom:1px solid var(--line)}
dl div:last-child{border-bottom:0}
dt{font-size:.82rem;color:var(--muted)}
dd{font-size:.9rem;font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}

.acts{display:grid;gap:.7rem;margin-top:1.75rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:50px;
     padding:.8rem 1.5rem;border-radius:100px;font-size:.95rem;font-weight:600;
     border:1.5px solid transparent;transition:transform .2s var(--e),box-shadow .25s var(--e),
     background .25s var(--e),color .25s var(--e),border-color .25s var(--e)}
.btn:hover{transform:translateY(-2px)}
.btn-pri{background:var(--brand);color:#fff;box-shadow:0 12px 32px rgba(219,42,110,.28)}
.btn-pri:hover{background:var(--brand-600)}
.btn-wa{background:#25d366;color:#fff;box-shadow:0 12px 32px rgba(37,211,102,.3)}
:focus-visible{outline:3px solid rgba(219,42,110,.45);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .btn:hover{transform:none}
}
</style>
</head>
<body>
<main class="card">
  <div class="card-hd">
    <a href="/" style="display:flex;align-items:center;gap:.6rem">
      <img class="mk" src="assets/logo-96.png" srcset="assets/logo-96.png 1x, assets/logo-256.png 2x" alt="" aria-hidden="true" width="32" height="32" decoding="async">
      <span class="name">Kanishka Creates</span>
    </a>
  </div>

  <div class="body">
    <div class="mark wait" id="mark">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
    </div>
    <h1 id="title">Checking your booking</h1>
    <p class="msg" id="message">One moment while we confirm your payment with Cashfree.</p>
    <dl id="details" hidden></dl>
    <div class="acts">
      <a href="/#booking" class="btn btn-pri">Back to Kanishka Creates</a>
      <a href="https://wa.me/919410891738" target="_blank" rel="noopener" class="btn btn-wa">Message us on WhatsApp</a>
    </div>
  </div>
</main>

<script>
(function () {
  var bookingId = (new URLSearchParams(location.search).get('id') || '').toUpperCase();
  var markEl = document.getElementById('mark');
  var titleEl = document.getElementById('title');
  var msgEl = document.getElementById('message');
  var dlEl = document.getElementById('details');

  var ICONS = {
    wait: '<path d="M12 3a9 9 0 1 0 9 9"/>',
    ok:   '<path d="M4 12.5l5 5L20 6.5"/>',
    fail: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>'
  };

  function render(kind, title, msg) {
    markEl.className = 'mark ' + kind;
    markEl.innerHTML = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[kind] + '</svg>';
    titleEl.textContent = title;
    msgEl.textContent = msg;
  }

  if (!/^KVX-[A-Z0-9]{6}$/.test(bookingId)) {
    render('fail', 'Booking not found',
      'That link does not look right. If you have just paid, message us on WhatsApp with your payment reference and we will sort it out.');
    return;
  }

  var attempts = 0;

  function showDetails(b) {
    var rows =
      '<div><dt>Reference</dt><dd>' + b.bookingId + '</dd></div>' +
      '<div><dt>Session</dt><dd>' + (b.sessionLabel || '') + '</dd></div>' +
      '<div><dt>Date</dt><dd>' + (b.dateLabel || '') + '</dd></div>' +
      '<div><dt>Time</dt><dd>' + (b.timeLabel || '') + ' IST</dd></div>';
    if (b.amount > 0) rows += '<div><dt>Amount</dt><dd>&#8377;' + b.amount + '</dd></div>';
    dlEl.innerHTML = rows;
    dlEl.hidden = false;
  }

  function poll() {
    attempts++;
    fetch('/api/booking-status?id=' + encodeURIComponent(bookingId))
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.data.error || 'Could not load your booking.');
        var b = res.data;
        showDetails(b);

        if (b.status === 'confirmed') {
          render('ok', 'You are booked in!',
            'We have emailed your confirmation. The meeting link comes over WhatsApp and email before the call.');
          return;
        }
        if (b.status === 'cancelled') {
          render('fail', 'Payment did not go through',
            'Your slot has been released and nothing was charged. You are welcome to book again.');
          return;
        }
        if (attempts < 6) {
          render('wait', 'Confirming your payment',
            'This can take a few seconds. Please keep this page open.');
          setTimeout(poll, 2500);
          return;
        }
        render('wait', 'Payment still processing',
          'Your slot is held. We will confirm by email shortly — message us on WhatsApp if you do not hear back within an hour.');
      })
      .catch(function (err) {
        render('fail', 'We could not check your booking',
          (err.message || 'Please try again.') + ' Message us on WhatsApp with reference ' + bookingId + '.');
      });
  }

  poll();
})();
</script>
</body>
</html>
